services:
  proxy:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${PUBLIC_PROXY_PORT:-1297}:1297"
    volumes:
      - proxy-ca:/home/ffruntime/.mitmproxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:1297/healthz', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    command: ["python", "bot.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  proxy-ca:
